# Content pages use a .njk extension (Nunjucks templates). Decap needs
# BOTH "format" and "extension" set explicitly on each file entry for
# non-standard extensions like this — format alone isn't always enough
# for Decap to correctly locate and parse the frontmatter block.
backend:
  name: git-gateway
  branch: main
media_folder: src/images
public_folder: /images
publish_mode: simple
format: frontmatter
collections:
- name: pages
  label: Website Pages
  files:
  - name: site_settings
    label: Site Settings (phone, email, address, etc.)
    file: _data/site.json
    format: json
    fields:
    - label: Company Name
      name: company_name
      widget: string
    - label: Tagline
      name: tagline
      widget: string
    - label: Phone Display
      name: phone_display
      widget: string
    - label: Phone Link
      name: phone_link
      widget: string
    - label: Whatsapp Number
      name: whatsapp_number
      widget: string
    - label: Whatsapp Default Message
