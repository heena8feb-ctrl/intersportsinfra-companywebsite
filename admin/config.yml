      name: website
      widget: string
    - label: Address Line1
      name: address_line1
      widget: string
    - label: Address Line2
      name: address_line2
      widget: string
    - label: Gstin
      name: gstin
      widget: string
      hint: Company GST registration number.
    - label: Certifications
